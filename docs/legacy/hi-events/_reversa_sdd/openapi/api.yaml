openapi: 3.0.3
info:
  title: Hi.Events Platform API
  description: Contratos operacionais da API pública e de gestão do Hi.Events.
  version: 1.0.0
servers:
  - url: https://localhost:8443
    description: Servidor de Desenvolvimento Local (Nginx SSL)
  - url: https://api.hi.events
    description: Servidor de Produção

paths:
  /api/public/events/{event_id}/orders:
    post:
      summary: Criar pedido de ingressos (Reserva Temporária)
      tags:
        - Pedidos Públicos
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido criado com status RESERVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPublicResponse'
        '409':
          description: Conflito de concorrência ou assento já ocupado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Erro de validação de dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/events/{event_id}/orders/{short_id}:
    get:
      summary: Consultar pedido por ID público amigável
      tags:
        - Pedidos Públicos
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
        - name: short_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPublicResponse'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/events/{event_id}/orders/{short_id}/complete:
    post:
      summary: Concluir pedido e emitir ingressos
      tags:
        - Pedidos Públicos
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
        - name: short_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pedido transicionado para COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCompleteResponse'

  /api/public/events/{event_id}/orders/{short_id}/payment-intent:
    post:
      summary: Gerar Payment Intent no Stripe
      tags:
        - Pagamentos Públicos
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
        - name: short_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent criada com client_secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'

  /api/public/webhooks/stripe:
    post:
      summary: Ingestão de Webhooks do Stripe
      tags:
        - Webhooks
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Notificação recebida com sucesso
        '400':
          description: Assinatura inválida

  /api/manage/events/{event_id}/orders/{order_id}/refund:
    post:
      summary: Processar estorno total ou parcial
      tags:
        - Gestão de Vendas
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderRequest'
      responses:
        '200':
          description: Estorno efetuado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefundResponse'
        '403':
          description: Sem permissão ISSUE_REFUNDS ou VIEW_FINANCIALS

  /api/manage/events/{event_id}/financials:
    get:
      summary: Obter resumo financeiro do evento
      tags:
        - Relatórios
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resumo financeiro (redatado se sem permissão)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSummaryResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  schemas:
    CreateOrderRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - items
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        promo_code:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - product_id
              - product_price_id
              - quantity
            properties:
              product_id:
                type: integer
              product_price_id:
                type: integer
              quantity:
                type: integer
              seat_ids:
                type: array
                items:
                  type: integer

    OrderPublicResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            short_id:
              type: string
            event_id:
              type: integer
            status:
              type: string
              enum: [RESERVED, COMPLETED, AWAITING_OFFLINE_PAYMENT, ABANDONED, CANCELLED]
            currency:
              type: string
            total_amount:
              type: integer
            tax_amount:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            expires_at:
              type: string
              format: date-time

    OrderCompleteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            short_id:
              type: string
            status:
              type: string
            attendees:
              type: array
              items:
                type: object
                properties:
                  public_id:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  status:
                    type: string
                  ticket_url:
                    type: string

    PaymentIntentResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            provider_intent_id:
              type: string
            client_secret:
              type: string
            amount:
              type: integer
            currency:
              type: string
            status:
              type: string

    RefundOrderRequest:
      type: object
      required:
        - refund_amount
        - reason
      properties:
        refund_amount:
          type: integer
        reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer]
        cancel_order:
          type: boolean
        attendee_ids_to_cancel:
          type: array
          items:
            type: integer

    OrderRefundResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            amount:
              type: integer
            status:
              type: string
            provider_refund_id:
              type: string

    FinancialSummaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            currency:
              type: string
            gross_sales_amount:
              type: integer
              nullable: true
            net_sales_amount:
              type: integer
              nullable: true
            platform_fees_amount:
              type: integer
              nullable: true
            total_orders_completed:
              type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
