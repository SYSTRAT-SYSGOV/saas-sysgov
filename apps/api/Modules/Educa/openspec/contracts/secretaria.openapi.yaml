openapi: 3.1.0
info:
  title: SYS-Educa — Submódulo Secretaria (Matrículas, Enturmação e Ficha do Aluno)
  version: 0.1.0
  description: |
    Contrato da API do submódulo `secretaria` do módulo Educa (SYSGOV).
    Escopo: **Matrículas Acadêmicas**, **Enturmações**, **Controle de Vagas**,
    **Ficha Cadastral e Complementar do Aluno**, **Vínculo de Responsáveis** e **Transferências**.

    Convenções SYSGOV:
    - Tenant resolvido pelo middleware `ResolveTenant` via cabeçalho `X-Tenant-Slug`.
    - Alunos e responsáveis unificados no módulo `Pessoas` (`aluno_pessoa_id`, `responsavel_pessoa_id`).
    - Dados técnicos em JetBrains Mono (código de matrícula, NIS, SUS).
    - Toda mutação gravada em `AuditLogger` (module `educa`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/educa/secretaria
    description: Prefixo do submódulo secretaria

security:
  - sanctum: []

tags:
  - name: Matrículas
    description: Vínculo acadêmico anual do estudante com a escola e série
  - name: Enturmação
    description: Alocação do estudante em turmas físicas com controle de vagas
  - name: Alunos e Ficha Cadastral
    description: Perfil complementar do aluno e responsáveis legais integrados ao MDM de Pessoas
  - name: Transferências
    description: Remanejamentos internos e transferências externas

paths:
  /matriculas:
    get:
      tags: [Matrículas]
      operationId: listarMatriculas
      summary: Lista matrículas com filtros por escola, ano letivo, série e situação
      x-permission: educa.secretaria.matriculas.view
      parameters:
        - { name: school_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: academic_year_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: grade_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: status, in: query, schema: { type: string, enum: [ativa, remanejada, transferida, cancelada, concluida, abandonada, falecida] } }
        - { name: busca, in: query, schema: { type: string } }
      responses:
        "200":
          description: Lista de matrículas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Matricula" } }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

    post:
      tags: [Matrículas]
      operationId: criarMatricula
      summary: Realiza matrícula do estudante vinculando a pessoa cadastrada no MDM
      x-permission: educa.secretaria.matriculas.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatriculaCreate" }
      responses:
        "201":
          description: Matrícula criada com código gerado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatriculaResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { $ref: "#/components/responses/Conflito" }
        "422": { $ref: "#/components/responses/Validacao" }

  /matriculas/{matriculaId}:
    parameters:
      - { name: matriculaId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    get:
      tags: [Matrículas]
      operationId: obterMatricula
      summary: Detalha a matrícula com enturmações ativas e histórico
      x-permission: educa.secretaria.matriculas.view
      responses:
        "200":
          description: Matrícula detalhada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatriculaResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /matriculas/{matriculaId}/cancelar:
    parameters:
      - { name: matriculaId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [Matrículas]
      operationId: cancelarMatricula
      summary: Cancela a matrícula e encerra enturmações ativas
      x-permission: educa.secretaria.matriculas.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_cancelamento, justificativa]
              properties:
                data_cancelamento: { type: string, format: date }
                justificativa: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Matrícula cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatriculaResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/Validacao" }

  /matriculas/{matriculaId}/enturmar:
    parameters:
      - { name: matriculaId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [Enturmação]
      operationId: enturmarEstudante
      summary: Aloca o estudante em uma turma com validação de vagas e choques de horário
      x-permission: educa.secretaria.matriculas.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_class_id, data_entrada]
              properties:
                school_class_id: { $ref: "#/components/schemas/Uuid" }
                data_entrada: { type: string, format: date }
      responses:
        "200":
          description: Estudante enturmado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnturmacaoResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/Validacao" }

  /matriculas/{matriculaId}/remanejar:
    parameters:
      - { name: matriculaId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [Enturmação]
      operationId: remanejarEstudante
      summary: Transfere o estudante entre turmas da mesma escola/série
      x-permission: educa.secretaria.matriculas.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turma_destino_id, data_remanejamento]
              properties:
                turma_destino_id: { $ref: "#/components/schemas/Uuid" }
                data_remanejamento: { type: string, format: date }
                motivo: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Remanejamento realizado com liberação de vaga na turma de origem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatriculaResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/Validacao" }

  /alunos/{pessoaId}/perfil:
    parameters:
      - { name: pessoaId, in: path, required: true, schema: { type: integer, description: "ID da pessoa no módulo Pessoas" } }
    get:
      tags: [Alunos e Ficha Cadastral]
      operationId: obterPerfilAluno
      summary: Consulta a ficha cadastral e complementar do aluno
      x-permission: educa.secretaria.alunos.view
      responses:
        "200":
          description: Perfil do aluno
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilAlunoResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    put:
      tags: [Alunos e Ficha Cadastral]
      operationId: atualizarPerfilAluno
      summary: Atualiza dados complementares (NIS, SUS, Certidão Civil, AEE)
      x-permission: educa.secretaria.alunos.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerfilAlunoUpdate" }
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilAlunoResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer

  responses:
    NaoAutenticado:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Proibido:
      description: Sem permissão RBAC
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Conflito:
      description: Conflito de unicidade ou regra de negócio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Validacao:
      description: Erro de validação de dados
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }

  schemas:
    Erro:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }

    Uuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      minLength: 36
      maxLength: 36

    Matricula:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        aluno_pessoa_id: { type: integer, description: "FK para pessoas.id" }
        aluno_nome: { type: string }
        school_id: { $ref: "#/components/schemas/Uuid" }
        escola_nome: { type: string }
        course_id: { $ref: "#/components/schemas/Uuid" }
        grade_id: { $ref: "#/components/schemas/Uuid" }
        academic_year_id: { $ref: "#/components/schemas/Uuid" }
        codigo_matricula: { type: string, example: "2026-000001" }
        data_matricula: { type: string, format: date }
        tipo_matricula: { type: string, enum: [inicial, renovacao, transferencia_entrada] }
        status: { type: string, enum: [ativa, remanejada, transferida, cancelada, concluida, abandonada, falecida] }
        turma_atual:
          type: [object, "null"]
          properties:
            turma_id: { $ref: "#/components/schemas/Uuid" }
            turma_nome: { type: string }
            numero_ordem: { type: integer }

    MatriculaResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Matricula" }

    MatriculaCreate:
      type: object
      required: [aluno_pessoa_id, school_id, course_id, grade_id, academic_year_id, data_matricula]
      properties:
        aluno_pessoa_id: { type: integer }
        school_id: { $ref: "#/components/schemas/Uuid" }
        course_id: { $ref: "#/components/schemas/Uuid" }
        grade_id: { $ref: "#/components/schemas/Uuid" }
        academic_year_id: { $ref: "#/components/schemas/Uuid" }
        data_matricula: { type: string, format: date }
        tipo_matricula: { type: string, enum: [inicial, renovacao, transferencia_entrada], default: inicial }

    EnturmacaoResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            enrollment_id: { $ref: "#/components/schemas/Uuid" }
            school_class_id: { $ref: "#/components/schemas/Uuid" }
            data_entrada: { type: string, format: date }
            numero_ordem: { type: integer }
            status: { type: string, enum: [ativa, encerrada] }

    PerfilAlunoResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            pessoa_id: { type: integer }
            codigo_nis: { type: [string, "null"] }
            cartao_sus: { type: [string, "null"] }
            bolsa_familia: { type: boolean }
            necessidades_especiais: { type: boolean }
            laudo_medico_aee: { type: [string, "null"] }
            transporte_escolar_publico: { type: boolean }
            certidao_nascimento_termo: { type: [string, "null"] }
            certidao_nascimento_livro: { type: [string, "null"] }
            certidao_nascimento_folha: { type: [string, "null"] }
            certidao_cartorio: { type: [string, "null"] }

    PerfilAlunoUpdate:
      type: object
      properties:
        codigo_nis: { type: string, maxLength: 20 }
        cartao_sus: { type: string, maxLength: 20 }
        bolsa_familia: { type: boolean }
        necessidades_especiais: { type: boolean }
        laudo_medico_aee: { type: string, maxLength: 255 }
        transporte_escolar_publico: { type: boolean }
        certidao_nascimento_termo: { type: string, maxLength: 30 }
        certidao_nascimento_livro: { type: string, maxLength: 20 }
        certidao_nascimento_folha: { type: string, maxLength: 20 }
        certidao_cartorio: { type: string, maxLength: 100 }
