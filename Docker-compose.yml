services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [mysql, redis]
    env_file: ./apps/api/.env.docker
    ports: ["8000:8000"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sysgov
      MYSQL_USER: sysgov
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [sysgov-mysql:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  sysgov-mysql:
