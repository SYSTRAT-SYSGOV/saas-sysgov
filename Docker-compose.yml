services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [mysql, redis]
    env_file: ./apps/api/.env.docker
    ports: ["8000:8000"]
    volumes:
      - ./apps/api:/var/www/html
      - ./apps/api/.env.docker:/var/www/html/.env
      - /var/www/html/vendor
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sysgov
      MYSQL_USER: sysgov
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [sysgov-mysql:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["5175:5175"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web-client/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/sdk/node_modules
  web-client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    depends_on: [api]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["5174:5174"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web-client/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/sdk/node_modules
volumes:
  sysgov-mysql:
