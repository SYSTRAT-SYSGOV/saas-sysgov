name: CI

on: [push, pull_request]

jobs:
  web-admin:
    name: Admin Web Panel (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --workspace apps/web run typecheck
      - name: Run Unit & Accessibility Tests
        run: npm --workspace apps/web run test
      - name: Production Build
        run: npm --workspace apps/web run build

  web-client:
    name: Client Web Portal (apps/web-client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --workspace apps/web-client run typecheck
      - name: Run Unit Tests
        run: npm --workspace apps/web-client run test
      - name: Production Build
        run: npm --workspace apps/web-client run build

  api:
    name: Backend API (apps/api - PHP 8.4)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Tests/Concerns/GuardAgainstRealDatabase.php bloqueia qualquer suíte que
      # não esteja em sqlite/:memory: — não sobrescreva DB_CONNECTION/DB_HOST/etc
      # aqui pro job inteiro. Isso já existiu com DB_CONNECTION=mysql apontando
      # pro service container abaixo, sobrepondo o <env> sqlite do phpunit.xml
      # (env real do processo vence o <env> do phpunit.xml) e derrubando os 176
      # testes com 'BLOQUEADO: os testes estão apontando para o banco MYSQL' —
      # só não tinha aparecido porque o PHPStan sempre falhava antes e barrava
      # o job. Nada neste pipeline (composer, phpstan, phpunit em sqlite) precisa
      # de um MySQL real, então o service container foi removido também.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PSR-4 autoload case consistency
        # Pega divergências de case entre namespace e pasta (ex.: database/seeders
        # vs Database\Seeders) que passam despercebidas em filesystem
        # case-insensitive (Windows/macOS) mas quebram silenciosamente em
        # produção/CI (Linux) — o composer aqui roda com --optimize e --strict-psr
        # justamente pra falhar o build em vez de deixar a classe sumir do autoload.
        run: composer dump-autoload --optimize --strict-psr
      - name: Check PHP syntax
        run: Get-ChildItem app,Modules -Recurse -Filter *.php | ForEach-Object { php -l $_.FullName }
        shell: pwsh
      - name: PHPStan Static Analysis
        run: vendor/bin/phpstan analyse --no-progress
      - name: Run Pest/PHPUnit Test Suite (with Tenant Isolation)
        run: vendor/bin/phpunit
