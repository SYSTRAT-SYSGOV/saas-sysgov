name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: package-lock.json,
          }
      - run: npm ci --workspace apps/web
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sysgov_test
      DB_USERNAME: sysgov
      DB_PASSWORD: secret
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sysgov_test
          MYSQL_USER: sysgov
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -usysgov -psecret" --health-interval=10s --health-timeout=5s --health-retries=10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          {
            php-version: "8.3",
            extensions: mbstring,
            pdo_mysql,
            coverage: none,
          }
      - run: composer install --no-interaction --prefer-dist
      - run: Get-ChildItem app,Modules -Recurse -Filter *.php | ForEach-Object { php -l $_.FullName }
        shell: pwsh
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpunit
