name: CI

on: [push, pull_request]

jobs:
  web-admin:
    name: Admin Web Panel (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --workspace apps/web run typecheck
      - name: Run Unit & Accessibility Tests
        run: npm --workspace apps/web run test
      - name: Production Build
        run: npm --workspace apps/web run build

  web-client:
    name: Client Web Portal (apps/web-client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --workspace apps/web-client run typecheck
      - name: Run Unit Tests
        run: npm --workspace apps/web-client run test
      - name: Production Build
        run: npm --workspace apps/web-client run build

  api:
    name: Backend API (apps/api - PHP 8.4)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sysgov_test
      DB_USERNAME: sysgov
      DB_PASSWORD: secret
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sysgov_test
          MYSQL_USER: sysgov
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -usysgov -psecret" --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PSR-4 autoload case consistency
        # Pega divergências de case entre namespace e pasta (ex.: database/seeders
        # vs Database\Seeders) que passam despercebidas em filesystem
        # case-insensitive (Windows/macOS) mas quebram silenciosamente em
        # produção/CI (Linux) — o composer aqui roda com --optimize e --strict-psr
        # justamente pra falhar o build em vez de deixar a classe sumir do autoload.
        run: composer dump-autoload --optimize --strict-psr
      - name: Check PHP syntax
        run: Get-ChildItem app,Modules -Recurse -Filter *.php | ForEach-Object { php -l $_.FullName }
        shell: pwsh
      - name: PHPStan Static Analysis
        run: vendor/bin/phpstan analyse --no-progress
      - name: Run Pest/PHPUnit Test Suite (with Tenant Isolation)
        run: vendor/bin/phpunit
